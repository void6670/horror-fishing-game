er is warm here. It should not be warm.`,`Stay on the boards. Do not carry what bleeds.`,`It can smell what you've caught.`]},{title:`Night Six`,sub:`The Deep`,lines:()=>[`You are standing on the bottom of the sea.`,`You should not be able to breathe. You are not breathing.`,`Something down here has a light, and it is very patient.`]},{title:`The Last Night`,sub:`Hollow Lake`,lines:()=>[`Hollow Lake.`,`It is the night of the fourteenth.`,`The tent is exactly where you left it.`]}],Bd=()=>[`...${Fd()}? Can you hear me? It's Dr. Okafor. You're at St. Agnes.`,`You were in the water a very long time.`,`Squeeze my hand if you can hear me. ...No? That's alright. We'll try again tomorrow.`,`Ruth, they can hear you. Talk to them. Tell ${Fd()} about the lake.`],Vd=()=>[Fd(),`${Fd()}...`,`wake up`,`it's four`,`five more minutes`,`come on`,`look at the water`,`you turned it off`,`${Fd()}, it's four`],Hd={1:{wake:()=>[`6:00 AM.`,`Your own bed. Your own ceiling.`,`Your hands smell like lake water.`],clock:`An old brass wind-up alarm clock. Its alarm hand is set to 4:00. You have no idea how it got here.`,computer:()=>[`From: Mom`,`Subject: please call`,``,`${Fd()}, it's almost the 14th again. I know you don't want to talk about it. I just want to hear your voice.`,``,`Also Dr. Okafor's office called. They said you missed Thursday.`,`Love, Mom`],phone:`No new messages. The battery is at 4%.`},2:{wake:()=>[`6:00 AM.`,`You fell asleep fishing. No. You fell asleep in bed.`,`There is frost on the inside of the window.`],clock:`The brass clock reads 4:17. You wind it. You set it. It reads 4:17.`,computer:()=>[`FORECAST — HOLLOW LAKE AREA`,``,`Tonight: Clear and cold. First hard freeze of the season.`,`Ice will NOT be safe for weeks. Stay off the lake.`,``,`(Why did you search for Hollow Lake?)`],phone:`One missed call. No number. The voicemail is eight seconds of water.`},3:{wake:()=>[`6:00 AM.`,`Your fingertips are numb.`,`Something is pinned to the refrigerator that was not there ye
